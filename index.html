<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Иммунология · тренажёр 100 вопросов</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#65707f;--line:#e3e7ee;
--ok:#1b7a4b;--okbg:#e8f6ee;--bad:#b3261e;--badbg:#fdecea;--acc:#2f5bd7;--accbg:#eaf0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:14px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;
box-shadow:0 1px 2px rgba(16,24,40,.04)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;
font-size:13px;color:var(--mut)}
.prog{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 12px}
.prog>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.qtext{font-size:18px;font-weight:600;line-height:1.4;margin:0 0 4px}
.tag{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);
border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;
border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;font:inherit;color:inherit;
cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:#c3cbdb;background:#fbfcfe}
.opt .l{font-weight:700;color:var(--mut);min-width:16px}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.sel .l{color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{color:var(--bad)}
.opt[disabled]{cursor:default}
.btn{border:0;border-radius:11px;padding:12px 20px;font:inherit;font-weight:600;cursor:pointer;
background:var(--acc);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.fb{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:14px;display:none}
.fb.show{display:block}
.fb.good{background:var(--okbg);border:1px solid #bfe3ce}
.fb.bad{background:var(--badbg);border:1px solid #f3c9c4}
.fb b{display:block;margin-bottom:3px}
.res{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px}
.mut{color:var(--mut);font-size:14px}
.mist{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.mist h3{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.mist .item{font-size:14px;margin:0 0 12px}
.mist .item .a{color:var(--ok);font-weight:600}
.kbd{font-size:12px;color:var(--mut);margin-top:18px}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
padding:1px 6px;font-size:12px}
@media(max-width:520px){.qtext{font-size:17px}.wrap{padding:18px 12px 40px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const BANK = [{"q":"Центральная задача иммунитета:","o":["обеспечение генетической целостности организма","обеспечение противоинфекционной защиты","отторжение пересаженных клеток, тканей и органов","реализация запрограммированной клеточной смерти (апоптоза)","обеспечение состояния толерантности к «своему»."],"m":false,"a":[0],"why":"по Петрову/Ярилину центральная задача иммунитета — обеспечение генетической целостности (гомеостаза); остальное — частные функции","warn":false,"key":false},{"q":"Приобретённый иммунитет характеризуется:","o":["специфичностью","образованием антител","формированием иммунологической памяти","активацией эндокринной системы","эритропоэзом."],"m":true,"a":[0,1,2],"why":"специфичность, антитела, память — свойства адаптивного иммунитета; эндокринная активация и эритропоэз — нет","warn":false,"key":false},{"q":"К фагоцитам относятся:","o":["макрофаги","нейтрофилы","Th-лимфоциты","NК-клетки","В-лимфоциты."],"m":true,"a":[0,1],"why":"фагоцитируют макрофаги и нейтрофилы; Th, NK и B-клетки — нет","warn":false,"key":false},{"q":"К бактерицидным факторам крови относятся:","o":["лизоцим","С-реактивный белок","комплемент","фибриноген","бета-лизины"],"m":true,"a":[0,2,4],"why":"по официальному ключу бактерицидные — лизоцим, комплемент, β-лизины; С-реактивный белок ключ не учитывает (он белок острой фазы и опсонин)","warn":false,"key":true},{"q":"Лимфопоэз осуществляется:","o":["в костном мозге","в селезёнке","в лимфатических узлах","в пейеровых бляшках кишечника","верно всё перечисленное."],"m":false,"a":[0],"why":"по официальному ключу лимфопоэз идёт в костном мозге; в селезёнке и лимфоузлах уже пролиферация зрелых лимфоцитов","warn":false,"key":true},{"q":"Основные функции специфического иммунного ответа:","o":["образование антител","накопление сенсибилизированных лимфоцитов","пиноцитоз","фагоцитоз","активация эндокринной системы"],"m":true,"a":[0,1],"why":"эффекторы адаптивного ответа — антитела и сенсибилизированные лимфоциты","warn":false,"key":false},{"q":"Клеточно-гуморальная теория иммунитета обоснована:","o":["Р. Кохом","И. Мечниковым","Л. Пастером","П. Эрлихом","Э. Берингом."],"m":true,"a":[1,3],"why":"Мечников — клеточная теория (фагоцитоз), Эрлих — гуморальная (антитела)","warn":false,"key":false},{"q":"Особенности врождённого иммунитета:","o":["реализуется только лимфоидными клетками","реализуется только миелоидными клетками","активируется только при воздействии антигена","активируется независимо от попадания антигена","формирует клетки иммунологической памяти."],"m":false,"a":[3],"why":"врождённый иммунитет работает без предварительного контакта с антигеном и не формирует память","warn":false,"key":false},{"q":"Тoll-подобные рецепторы распознают:","o":["антигены вирусов","группы липидов поверхностных антигенов бактерий","иммунные комплексы","углеводные группы поверхностных антигенов бактерий","суперантигены."],"m":true,"a":[1,3],"why":"TLR распознают консервативные PAMP — липидные и углеводные структуры (LPS, липотейхоевая кислота)","warn":true,"key":false},{"q":"Кожа, как периферический отдел иммунной системы содержит:","o":["дендритные клетки","NK-клетки","В-лимфоциты","купферовские клетки","тучные клетки."],"m":true,"a":[0,4],"why":"в коже — дендритные клетки Лангерганса и тучные; купферовские — в печени","warn":true,"key":false},{"q":"Назовите клетки, которые образуются в костном мозге:","o":["лимфоциты","эритроциты","дендритные клетки","базофилы","верно всё перечисленное."],"m":false,"a":[4],"why":"костный мозг — источник всех линий крови, включая лимфоциты","warn":false,"key":false},{"q":"В активации клеток врождённого иммунитета участвуют:","o":["маннозо-фукозные рецепторы","В-лимфоциты","рецепторы-«мусорщики»","Т-лимфоциты","компоненты комплемента."],"m":true,"a":[0,2,4],"why":"маннозо-фукозные и скавенджер-рецепторы, комплемент; B- и T-лимфоциты — адаптивные","warn":false,"key":false},{"q":"Комплемент был открыт:","o":["Л. Пастером","Ж. Борде","К. Ландштейнером","С. Тонегава","Ж. Миллером."],"m":false,"a":[1],"why":"комплемент открыт Ж. Борде в 1895 г.","warn":false,"key":false},{"q":"В активации клеток врождённого иммунитета участвуют:","o":["рецепторы для маннозы","Toll-подобные рецепторы","скавенджер-рецепторы","NК-клетки","верно всё перечисленное."],"m":false,"a":[4],"why":"все перечисленные структуры и клетки относятся к врождённому звену","warn":false,"key":false},{"q":"Основные функции макрофага:","o":["синтез иммуноглобулинов","презентация антигена Т-хелперам","синтез перфоринов","участие в аллергических реакциях немедленного типа","верно всё перечисленное."],"m":false,"a":[1],"why":"макрофаг — профессиональная АПК: презентация антигена Т-хелперам","warn":false,"key":false},{"q":"Участие системы комплемента в иммунных реакциях:","o":["связывает Ig M","связывает Ig G","участвует в развитии иммунного воспаления","участвует в формировании аллергических реакций II типа","верно всё перечисленное."],"m":false,"a":[4],"why":"C1q связывает IgM и IgG, C3a/C5a запускают воспаление, комплемент участвует в реакциях II типа","warn":false,"key":false},{"q":"Периферические органы иммунной системы представлены:","o":["пейеровыми бляшками кишечника","костным мозгом","вилочковой железой","селезёнкой","клетками периферической крови."],"m":true,"a":[0,3,4],"why":"по официальному ключу периферические — пейеровы бляшки, селезёнка и клетки периферической крови","warn":false,"key":true},{"q":"Назовите периферические органы иммунной системы:","o":["костный мозг","печень","тимус","селезёнка","поджелудочная железа."],"m":true,"a":[1,3],"why":"по официальному ключу периферические — печень и селезёнка (печень как орган с клетками Купфера)","warn":false,"key":true},{"q":"Назовите органы и ткани, в которых присутствуют лимфоидные фолликулы:","o":["селезёнка","костный мозг","пейеровы бляшки кишечника","глоточные миндалины","аппендикс."],"m":true,"a":[2,3,4],"why":"по официальному ключу — пейеровы бляшки, миндалины, аппендикс; селезёнку ключ не учитывает, хотя фолликулы в ней есть","warn":false,"key":true},{"q":"Иммунокомпетентными клетками являются:","o":["дендритные клетки","эозинофилы","В-лимфоциты","купферовские клетки","тучные клетки."],"m":true,"a":[0,2],"why":"по официальному ключу иммунокомпетентные — дендритные и B-лимфоциты; купферовские клетки не учитываются","warn":false,"key":true},{"q":"Отметьте клетки, которые обладают фагоцитарной активностью:","o":["макрофаги","нейтрофилы","тромбоциты","эритроциты","лимфоциты."],"m":true,"a":[0,1],"why":"фагоцитарная активность — у макрофагов и нейтрофилов","warn":false,"key":false},{"q":"Основная роль макрофагов:","o":["презентация антигена","секреция гистамина","секреция иммуноглобулинов","поглощение и деструкция бактерий","активация комплемента."],"m":true,"a":[0,3],"why":"презентация антигена и поглощение/деструкция бактерий; гистамин — тучные клетки, Ig — B-клетки","warn":false,"key":false},{"q":"Профессиональные АПК:","o":["Т-киллеры","дендритные клетки","тучные клетки","NK-клетки","верно всё перечисленное."],"m":false,"a":[1],"why":"профессиональные АПК — дендритные клетки (а также макрофаги и B-лимфоциты)","warn":false,"key":false},{"q":"Активация системы комплемента по классическому пути связана:","o":["с выработкой интерлейкина-2","воздействием интерферонов","с участием комплекса антиген/антитело","активацией Toll-подобных рецепторов","верно всё перечисленное."],"m":false,"a":[2],"why":"классический путь активируется комплексом антиген/антитело (C1q)","warn":false,"key":false},{"q":"Активация системы комплемента по лектиновому пути связана с действием:","o":["цитокинов NK-клеток","перфоринов NK-клеток","гистамина тучных клеток","пептидов- антибиотиков","неверно всё перечисленное."],"m":false,"a":[4],"why":"лектиновый путь идёт через маннозосвязывающий лектин — его в списке нет","warn":false,"key":false},{"q":"Дендритные клетки – это клетки, которые:","o":["образуются в костном мозге","образуются в вилочковой железе","выполняют антиген-презентирующую функцию","экспрессируют антиг ,{"q":"Иммунологически привилегированные органы – это:","o":["жизненно важные органы, отделённые от иммунной системы гистогематическими барьерами","лимфатические узлы","паренхиматозные органы с высоким содержанием антиген-реактивных клеток","центральные органы иммунной системы","аллотрансплантаты."],"m":false,"a":[0],"why":"иммунологически привилегированные органы отделены гистогематическими барьерами","warn":false,"key":false},{"q":"NK-клетки:","o":["отсутствуют в лимфе","не формируют иммунологической памяти","дифференцируются из общей лимфоидной клетки-предшественника лимфоцитов","осуществляют киллинг по перфорин-гранзимовому механизму","верно всё перечисленное."],"m":false,"a":[4],"why":"NK не формируют память, развиваются из общего лимфоидного предшественника, киллинг перфорин-гранзимовый","warn":false,"key":false},{"q":"Лимфоциты с гамма-дельта рецепторами:","o":["имеют неограниченное разнообразие TCR","не требуют предварительного процессинга и представления антигена АПК","находятся преимущественно в эпидермисе и слизистой ЖКТ","находятся преимущественно в лимфоузлах","формируют клетки иммунологической памяти."],"m":true,"a":[1,2],"why":"γδ-Т-клетки не требуют процессинга, преобладают в эпидермисе и слизистой ЖКТ","warn":false,"key":false},{"q":"Распознавание антигена NK-клетками происходит:","o":["без ограничения по МНС","с ограничением по МНС","после активации Toll-подобными рецепторами","после активации клетками иммунологической памяти","верно всё перечисленное."],"m":false,"a":[0],"why":"NK распознают без ограничения по MHC","warn":false,"key":false},{"q":"Функции В-лимфоцитов:","o":["осуществление фагоцитоза","синтез антител","высвобождение гистамина","активация Т-хелперов","цитотоксическое действие на клетки-мишени."],"m":true,"a":[1,3],"why":"B-лимфоциты синтезируют антитела и презентируют антиген Т-хелперам","warn":false,"key":false},{"q":"Лимфоидная ткань слизистых оболочек (MALT) включает:","o":["лимфоидную ткань кишечника (GALT)","лимфоидную ткань бр const L = "АБВГД";
const app = document.getElementById("app");
let st = null;

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function prep(q) {
  const order = shuffle([0,1,2,3,4]);
  return { q: q.q, why: q.why, multi: q.m, warn: q.warn, key: q.key,
           opts: order.map((oi, k) => ({ t: q.o[oi], l: L[k], ok: q.a.includes(oi), i: k })) };
}

function start(count) {
  const pool = shuffle(BANK).slice(0, count).map(prep);
  st = { qs: pool, i: 0, ok: 0, wrong: [], sel: new Set(), done: false };
  render();
}

function render() {
  if (!st) return home();
  if (st.i >= st.qs.length) return finish();
  const q = st.qs[st.i];
  const sel = st.sel;
  const need = q.opts.filter(o => o.ok).length;
  const answered = st.done;

  app.innerHTML = `
  <h1>Иммунология · тренажёр</h1>
  <p class="sub">Вопросы и варианты перемешиваются заново при каждом запуске.</p>
  <div class="card">
    <div class="bar">
      <span>Вопрос ${st.i + 1} из ${st.qs.length}</span>
      <div class="prog"><i style="width:${(st.i / st.qs.length) * 100}%"></i></div>
      <span>Верно: ${st.ok}</span>
    </div>
    <p class="qtext">${esc(q.q)}${q.multi ? '<span class="tag">несколько ответов</span>' : ''}${q.key ? '<span class="tag">ключ преподавателя</span>' : ''}</p>
    <div id="opts">
      ${q.opts.map(o => {
        let cls = "opt";
        if (answered) {
          if (o.ok) cls += " ok";
          else if (sel.has(o.i)) cls += " bad";
        } else if (sel.has(o.i)) cls += " sel";
        return `<button class="${cls}" data-i="${o.i}" ${answered ? "disabled" : ""}>
          <span class="l">${o.l}</span><span>${esc(o.t)}</span></button>`;
      }).join("")}
    </div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <button class="btn" id="main" ${(!answered && sel.size === 0) ? "disabled" : ""}>
        ${answered ? (st.i + 1 === st.qs.length ? "Показать результат" : "Следующий вопрос") : "Проверить"}</button>
      <span class="mut" id="hint">${answered ? "" : (q.multi ? "Отметьте все верные варианты" : "Выберите один вариант")}</span>
    </div>
  </div>
  <p class="kbd">Клавиши: <kbd>1</kbd>–<kbd>5</kbd> — выбрать, <kbd>Enter</kbd> — проверить / далее.</p>`;

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (st.done) return;
    const i = +b.dataset.i;
    if (q.multi) { st.sel.has(i) ? st.sel.delete(i) : st.sel.add(i); }
    else { st.sel.clear(); st.sel.add(i); }
    render();
  });

  document.getElementById("main").onclick = () => {
    if (!st.done) check(q); else { st.i++; st.sel = new Set(); st.done = false; render(); }
  };

  if (st.done) {
    const fb = document.getElementById("fb");
    const right = [...sel].sort().join() === q.opts.filter(o => o.ok).map(o => o.i).sort().join();
    fb.className = "fb show " + (right ? "good" : "bad");
    const ans = q.opts.filter(o => o.ok).map(o => o.l).join(", ");
    fb.innerHTML = `<b>${right ? "Верно" : "Неверно. Правильные: " + ans}</b>${esc(q.why)}`;
  }
}

function check(q) {
  const correct = q.opts.filter(o => o.ok).map(o => o.i).sort().join();
  const chosen = [...st.sel].sort().join();
  if (correct === chosen) st.ok++;
  else st.wrong.push({ q, ans: q.opts.filter(o => o.ok).map(o => o.l).join(", ") });
  st.done = true;
  render();
}

function finish() {
  const n = st.qs.length, ok = st.ok, pct = Math.round(ok / n * 100);
  const grade = pct >= 90 ? "Отлично — можно идти на тест" : pct >= 75 ? "Хорошо, но есть пробелы" : pct >= 50 ? "Ещё учить и учить" : "Пока слабо — вернитесь к разбору";
  app.innerHTML = `
  <h1>Иммунология · тренажёр</h1>
  <p class="sub">Вопросы и варианты перемешиваются заново при каждом запуске.</p>
  <div class="card">
    <div class="res">${ok} / ${n}</div>
    <p class="mut">${pct}% · ${grade}</p>
    <div class="row">
      <button class="btn" id="again">Пройти заново</button>
      <button class="btn ghost" id="only20">20 случайных</button>
    </div>
    ${st.wrong.length ? `<div class="mist"><h3>Ошибки (${st.wrong.length})</h3>
      ${st.wrong.map(w => `<div class="item">${esc(w.q.q)}<br><span class="a">Ответ: ${w.ans}</span></div>`).join("")}</div>` : ""}
  </div>`;
  document.getElementById("again").onclick = () => start(n);
  document.getElementById("only20").onclick = () => start(20);
}

function home() {
  app.innerHTML = `
  <h1>Иммунология · 100 вопросов</h1>
  <p class="sub">Как в Google-формах: где-то один ответ, где-то флажки. Порядок вопросов и вариантов каждый раз новый.</p>
  <div class="card">
    <p class="mut" style="margin-top:0">Сколько вопросов пройти?</p>
    <div class="row">
      <button class="btn" data-n="20">20 вопросов</button>
      <button class="btn ghost" data-n="50">50 вопросов</button>
      <button class="btn ghost" data-n="100">Все 100</button>
    </div>
    <p class="mut" style="margin:14px 0 0">После ответа показывается правильный вариант и короткое пояснение. В конце — разбор ошибок.</p>
  </div>`;
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => start(+b.dataset.n));
}

document.addEventListener("keydown", e => {
  if (!st || st.i >= st.qs.length) return;
  const q = st.qs[st.i];
  if (e.key === "Enter") { document.getElementById("main")?.click(); e.preventDefault(); return; }
  const k = "12345".indexOf(e.key);
  if (k >= 0 && !st.done) {
    const o = q.opts[k];
    if (!o) return;
    if (q.multi) { st.sel.has(o.i) ? st.sel.delete(o.i) : st.sel.add(o.i); } else { st.sel.clear(); st.sel.add(o.i); }
    render(); e.preventDefault();
  }
});

home();
</script></body></html>
